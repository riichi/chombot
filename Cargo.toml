[workspace]
members = [
    "chombot-common",
    "chombot",
    "chombot-kcc"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/riichi/chombot"
keywords = ["riichi", "mahjong", "discord", "chombo"]
categories = ["multimedia::images"]

[profile.release]
codegen-units = 1
lto = true

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chombot-common = { path = "chombot-common" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "json"] }
riichi_hand = "0.7.0"
scraper = "0.27.0"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
slug = "0.1.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
num-bigint = "0.5.1"
itertools = "0.15.0"
poise = "0.7.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"
